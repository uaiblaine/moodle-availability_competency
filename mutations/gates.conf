R2_pt_br_shipped | .gitattributes | r2_pt_br_shipped.pl
#   -> test_only_english_strings_ship

# Strings, settings and boilerplate read by the readiness test.
L1_lang_concatenation | lang/en/availability_competency.php | l1_lang_concatenation.pl
#   -> test_lang_files_are_data_only

S1_setting_in_main_config | settings.php | s1_setting_in_main_config.pl
#   -> test_settings_are_stored_per_plugin

B1_yui_source_without_boilerplate | yui/src/form/js/form.js | b1_yui_source_without_boilerplate.pl
#   -> test_source_files_carry_the_boilerplate

# Copyright of the code adapted from availability_cohort and availability_competencies.
C1_observer_credit_dropped | classes/observer.php | c1_observer_credit_dropped.pl
