# Mutation spec of availability_competency: each guard and the test that must redden without it.
# Run from the main session (fleet rule 6), on both database families:
#   mdl mutate moodle-availability_competency moodle-availability_competency/mutations/gates.conf --fast --branch MOODLE_503_STABLE --db pgsql
#   mdl mutate moodle-availability_competency moodle-availability_competency/mutations/gates.conf --fast --branch MOODLE_503_STABLE --db mariadb
#
# tag | file | perl script

# .gitattributes: what the release package carries.
R1_licence_left_out | .gitattributes | r1_licence_left_out.pl
